server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les fichiers de /assets/ portent une empreinte de leur contenu
    # dans leur nom : ils ne changent jamais, on peut les garder
    # longtemps en cache.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html référence la dernière version des fichiers /assets/ :
    # il doit être revalidé à chaque visite.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
