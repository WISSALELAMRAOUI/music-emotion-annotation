services:
  backend:
    build:
      context: ./backend
    container_name: music-emotion-backend
    environment:
      PORT: 5000
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    volumes:
      - ./backend:/app
    # Le conteneur écrit database.db dans le dossier monté : il doit
    # tourner sous le compte qui possède ./backend sur la machine hôte,
    # sinon SQLite ne peut que lire (erreur 500 à l'enregistrement).
    #
    # Renseignez APP_UID / APP_GID dans .env (« id -u », « id -g »).
    # N'utilisez pas UID/GID : ce sont des variables du shell, jamais
    # transmises à docker compose, qui retombe toujours sur 1000.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    networks:
      - proxy_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # Étape "production" : le site est construit puis servi par nginx.
      # Les fichiers portent une empreinte dans leur nom, donc aucun
      # cache ne peut servir une ancienne version.
      target: production
      args:
        # Figée au moment du build : après un changement d'URL,
        # relancez "docker compose up -d --build".
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
    container_name: music-emotion-frontend
    depends_on:
      - backend
    networks:
      - proxy_network
    restart: unless-stopped

networks:
  proxy_network:
    external: true