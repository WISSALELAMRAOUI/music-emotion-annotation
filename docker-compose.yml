services:
  backend:
    build:
      context: ./backend
    container_name: music-emotion-backend
    environment:
      PORT: 5000
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    volumes:
      - ./backend:/app
    user: "${UID:-1000}:${GID:-1000}"
    networks:
      - proxy_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
    container_name: music-emotion-frontend
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - proxy_network
    restart: unless-stopped

networks:
  proxy_network:
    external: true