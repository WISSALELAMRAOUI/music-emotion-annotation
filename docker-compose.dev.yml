# =========================================================
#  Développement : rechargement à chaud du frontend
#
#  Le fichier docker-compose.yml sert le site construit
#  (nginx). Pour développer avec le serveur Vite :
#
#    docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# =========================================================

services:
  frontend:
    build:
      target: dev
    ports:
      - "5173:5173"
    environment:
      # En développement l'URL est lue au démarrage,
      # sans reconstruire l'image.
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:5000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
